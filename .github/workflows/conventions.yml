# GIT-01: branch names and commit messages follow liffle_backend docs/GIT_CONVENTIONS.md.
# scripts/git/check-conventions.sh is identical in every Liffle repository.
name: conventions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: scripts/git/check-conventions.sh branch "$BRANCH"
      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A new branch has no "before": check what it adds to the default branch.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA"); fi
          scripts/git/check-conventions.sh range "$BASE" "$HEAD_SHA"
